aid: klar
name: Klar
type: Index
description: >-
  Klar is a Mexican digital financial services platform (neobank) headquartered
  in Mexico City with engineering in Berlin, serving roughly 7 million customers.
  Regulated by Mexico's CNBV, Klar offers a deposit account with yield, a
  no-annual-fee credit card, a secured (garantizada) credit card, the metal
  Platino card, personal loans, investment products, and Chubb-underwritten life
  and fraud insurance, plus cashback and interest-free-months (MSI) benefits. It
  also runs Klar Empresarial for business customers, partnered with Uber to
  launch the Uber Card in Mexico, and announced the acquisition of mortgage
  fintech Yave. Klar's product surface is delivered entirely through its consumer
  mobile app and website; as of this profile Klar publishes NO public developer
  portal, API reference, SDKs, or sandbox, and no OpenAPI, AsyncAPI, or webhook
  surface could be found. Third-party access to Klar accounts is generally
  brokered through Latin American open-finance aggregators (Belvo, Pluggy, Plaid)
  rather than a first-party Klar API. Klar does operate a public GitHub
  organization (klar-mx), but its repositories are internal infrastructure and
  DevOps tooling and forks, not client libraries for a Klar API.
